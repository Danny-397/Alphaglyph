name: Saved API answers

# Saves the Screener's default scan, the Predictor's track record and the PEAD
# study to frontend/data/api/ after each close, so those pages open instantly
# instead of waiting 30-60 s for the Render backend to wake. See
# tools/static_api.py. The backend runs here on the GitHub runner, not on
# Render, so this costs no free-tier instance hours.
#
# Two crons because GitHub often starts scheduled runs hours late: 21:30 UTC is
# after the close in both EDT and EST, and 01:30 UTC is a backup.

on:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '30 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-api
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Save answers
        run: python tools/static_api.py all

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/api
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Saved API answers: $(date -u +%Y-%m-%d)"
          # The forward-ledger job may have pushed in the meantime.
          git pull --rebase
          git push
