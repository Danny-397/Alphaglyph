name: Options model vs real quotes

# Prices every option in Tradeski's archive of real closing chains
# (data/options-archive in the Tradeski repo) with the options backtester's model
# and saves the comparison to frontend/data/options_quotes_check.json, which the
# Options page shows. See tools/options_quotes_check.py.
#
# Tradeski's snapshot job runs at 21:37 UTC on weekdays and GitHub often starts it
# hours late, so this runs at 03:30 UTC, with a later backup.

on:
  schedule:
    - cron: '30 3 * * 2-6'
    - cron: '30 13 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: options-quotes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Compare
        run: python tools/options_quotes_check.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/options_quotes_check.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Options model vs real quotes: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
