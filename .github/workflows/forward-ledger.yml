name: Forward ledger

# Logs the live Predictor's call for a fixed basket every trading day near the
# close, grades calls whose horizon has passed, and commits the record to
# frontend/data/. The commit history is the audit trail: each call is in a
# commit dated before its outcome existed. See tools/forward_ledger.py.
#
# Two crons, because GitHub schedules in UTC: 19:40 UTC is 15:40 New York time
# in summer (EDT) and 20:40 UTC is 15:40 in winter (EST). The script logs only
# between 15:15 and 16:15 ET on trading days, so the other run just grades.
# Both land inside the backend's own keep-alive window (09:00-16:30 ET), so
# this costs no extra Render free-tier hours.

on:
  schedule:
    - cron: '40 19 * * 1-5'
    - cron: '40 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Log calls now, even outside the 15:15-16:15 ET window'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-ledger
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install pandas numpy requests yfinance

      - name: Log and grade
        run: python tools/forward_ledger.py ${{ inputs.force && '--force' || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only when a call was logged or graded: the summary's
          # timestamp alone is not worth a commit (and a Vercel deploy).
          git add frontend/data/forward_ledger.csv
          if git diff --cached --quiet; then
            echo "No new or graded calls."
            exit 0
          fi
          git add frontend/data/forward_ledger.json
          git commit -m "Forward ledger: $(date -u +%Y-%m-%d)"
          git push
